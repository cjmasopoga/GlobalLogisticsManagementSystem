services:

  # ── SQL Server ────────────────────────────────────────────────────────────
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: glms-sql
    environment:
      SA_PASSWORD: "GLMS_StrongPwd!2025"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GLMS_StrongPwd!2025' -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend API ───────────────────────────────────────────────────────────
  glms-backend-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy

  # ── MVC Frontend ──────────────────────────────────────────────────────────
  glms-frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5000:8080"
    depends_on:
      - glms-backend-api

volumes:
  sqldata:
